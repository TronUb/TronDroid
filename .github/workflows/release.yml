name: Release APK
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Release version name"
        required: true
        default: "1.0.0"
      create_github_release:
        description: "Create a GitHub Release and attach the APK"
        required: true
        type: boolean
        default: true
permissions:
  contents: write
jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
      - name: Configure release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::error::One or more Android signing secrets are missing."
            exit 1
          fi
          KEYSTORE_PATH="$RUNNER_TEMP/trondroid-signing.p12"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          {
            echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH"
            echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
          } >> "$GITHUB_ENV"
      - name: Bootstrap EasyTDLib
        run: bash scripts/bootstrap-easytdlib.sh
      - name: Build signed release APK
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew --no-daemon assembleProdRelease
      - name: Prepare APK and release notes
        env:
          VERSION_NAME: ${{ inputs.version_name }}
          COMMIT_SHA: ${{ github.sha }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          APK="$(find app/build/outputs/apk/prod/release -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          cp "$APK" "TronDroid-$VERSION_NAME.apk"
          {
            echo "# TronDroid v$VERSION_NAME"
            echo
            echo "- Version code: `$VERSION_CODE`"
            echo "- Commit: `$COMMIT_SHA`"
            echo "- Commit URL: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$COMMIT_SHA"
            echo "- Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "- Built from: `$GITHUB_REF_NAME`"
            echo
            echo "## Changes"
            git log -20 --pretty=format:'- %h %s (%an)' "$COMMIT_SHA"
            echo
          } > release-notes.md
          cat release-notes.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: trondroid-release-${{ inputs.version_name }}
          path: |
            TronDroid-${{ inputs.version_name }}.apk
            release-notes.md
          if-no-files-found: error
          retention-days: 90
      - name: Create GitHub Release
        if: inputs.create_github_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version_name }}
          name: TronDroid v${{ inputs.version_name }}
          body_path: release-notes.md
          generate_release_notes: false
          files: |
            TronDroid-${{ inputs.version_name }}.apk
            release-notes.md
