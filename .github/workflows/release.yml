name: Release APK
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Release version name"
        required: true
        default: "1.0.0"
      create_github_release:
        description: "Create a GitHub Release and attach the APK"
        required: true
        type: boolean
        default: true
permissions:
  contents: write
jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
      - name: Bootstrap EasyTDLib
        run: bash scripts/bootstrap-easytdlib.sh
      - name: Build release APK
        run: ./gradlew --no-daemon assembleProdRelease
      - name: Rename APK
        run: cp app/build/outputs/apk/prod/release/app-prod-release-unsigned.apk "TronDroid-${{ inputs.version_name }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: trondroid-release-${{ inputs.version_name }}
          path: TronDroid-${{ inputs.version_name }}.apk
          if-no-files-found: error
          retention-days: 90
      - name: Create GitHub Release
        if: inputs.create_github_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version_name }}
          name: TronDroid v${{ inputs.version_name }}
          generate_release_notes: true
          files: TronDroid-${{ inputs.version_name }}.apk
